[project]
name = "polynomial-regression"
version = "0.1.0"
description = "CS F320 Assignment 1 - polynomial regression by closed form and gradient descent, ridge, lasso and Bayesian regression"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
# Tests, lint and formatting; uv installs this group by default.
dev = ["pytest>=8", "ruff>=0.17"]
# The demo notebook (notebooks/demo.ipynb), which only calls src/.
notebook = ["jupyterlab>=4"]

[tool.uv]
# The repo is run in place, not installed as a package.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, modern syntax, likely bugs, simplifications,
# comprehensions, naming, ruff's own rules.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RET", "PTH", "N", "RUF"]
# Phi, Q, R, A and friends follow the assignment's notation.
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# The notebook puts the repo root on sys.path before it can import src.
"notebooks/*" = ["E402"]
